<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="ElTentakel Graphics Systems - Glidulator">
  <title>ElTentakel Graphics Systems - Glidulator</title>
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a6e"/>
      <stop offset="0.55" stop-color="#1d1440"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="tentacle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#c2307a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cfd6e6"/>
      <stop offset="0.5" stop-color="#6b7896"/>
      <stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57e3d6"/>
      <stop offset="1" stop-color="#1b8f98"/>
    </linearGradient>
  </defs>

  <!-- eight tentacles as chip pins, curling outwards -->
  <g fill="none" stroke="url(#tentacle)" stroke-width="9" stroke-linecap="round">
    <path d="M58 62 C 38 58, 26 44, 34 30 C 40 20, 52 26, 46 34"/>
    <path d="M58 88 C 34 90, 18 82, 16 70 C 15 60, 27 60, 26 68"/>
    <path d="M58 114 C 34 112, 18 120, 16 132 C 15 142, 27 142, 26 134"/>
    <path d="M58 140 C 38 144, 26 158, 34 172 C 40 182, 52 176, 46 168"/>
    <path d="M142 62 C 162 58, 174 44, 166 30 C 160 20, 148 26, 154 34"/>
    <path d="M142 88 C 166 90, 182 82, 184 70 C 185 60, 173 60, 174 68"/>
    <path d="M142 114 C 166 112, 182 120, 184 132 C 185 142, 173 142, 174 134"/>
    <path d="M142 140 C 162 144, 174 158, 166 172 C 160 182, 148 176, 154 168"/>
  </g>
  <!-- suction cups -->
  <g fill="#ffc2dc">
    <circle cx="44" cy="54" r="2.4"/><circle cx="30" cy="84" r="2.4"/>
    <circle cx="30" cy="118" r="2.4"/><circle cx="44" cy="148" r="2.4"/>
    <circle cx="156" cy="54" r="2.4"/><circle cx="170" cy="84" r="2.4"/>
    <circle cx="170" cy="118" r="2.4"/><circle cx="156" cy="148" r="2.4"/>
  </g>

  <!-- the chip -->
  <rect x="56" y="46" width="88" height="108" rx="10" fill="url(#chip)" stroke="#8b7bd8" stroke-width="2"/>
  <rect x="72" y="66" width="56" height="56" rx="4" fill="url(#die)"/>
  <!-- two eyes on the die: it is an octopus after all -->
  <circle cx="89" cy="88" r="7" fill="#0b0820"/><circle cx="111" cy="88" r="7" fill="#0b0820"/>
  <circle cx="91" cy="86" r="2.2" fill="#ffffff"/><circle cx="113" cy="86" r="2.2" fill="#ffffff"/>
  <path d="M90 106 Q 100 113, 110 106" fill="none" stroke="#0b0820" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="142" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11" font-weight="bold" fill="#b9b0ee" letter-spacing="1">GL-1</text>

  <!-- wordmark -->
  <text x="212" y="92" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" font-style="italic" fill="url(#chrome)" stroke="#2b2350" stroke-width="1.5">ElTentakel</text>
  <text x="216" y="124" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2307a" letter-spacing="6">GRAPHICS SYSTEMS</text>
  <rect x="214" y="136" width="400" height="3" fill="#c2307a"/>
  <text x="216" y="164" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#5b5480" font-style="italic">Glidulator - every core a tentacle.</text>
</svg>
