# GLIDULAT.CFG - Glidulator GL-1 settings (example with every setting)
#
# Put this file into the directory the game is started from (usually next
# to GLIDE2X.OVL or glide2x.dll). One NAME=value per line; lines starting
# with # are ignored. Every setting below is commented out and shows its
# default: remove the # to change it. Names are not case-sensitive; values
# end at the first space, so paths must not contain spaces. Only the first
# 8 KB of the file are read. Windows: an environment variable of the same
# name (SET NAME=value) takes precedence over this file.
# Details: MANUAL.TXT, chapter 3.

# --- Display ---------------------------------------------------------------
# Screen mode: glide (the game's resolution) | desktop (Windows: keep the
# current mode) | WxH or WxHxBPP, e.g. 1280x720 for 16:9 monitors that
# stretch 4:3 modes | vga (DOS: VGA mode 13h, 320x200, no VESA needed).
#GLIDULATOR_DISPLAY=glide

# How the picture fills the screen: aspect (4:3 with black borders) |
# stretch (whole screen) | integer (whole-number scaling) | none (1:1).
#GLIDULATOR_SCALE=aspect

# DOS, VGA mode 13h only: blue (fine irregular dither) | bayer (classic
# regular pattern) | off (nearest colour, visible bands).
#GLIDULATOR_VGA_DITHER=blue

# On-screen display: frames per second, render and output time, render
# path, cores in use/available, resolutions, active image options. 0 | 1
#GLIDULATOR_OSD=0

# DOS: Print Screen saves the next frame as SHOT0000.BMP, SHOT0001.BMP, ...
# in the current directory (render resolution, without OSD). 0 | 1
#GLIDULATOR_SCREENSHOT=1

# DOS: write-combining for the video memory while the game runs (several
# times faster on real hardware; restored on exit). 0 | 1
#GLIDULATOR_WC=1

# Output gamma like the Voodoo RAMDAC. 1.0 = neutral (darker).
#SST_GAMMA=1.3

# --- Rendering -------------------------------------------------------------
# Pixel pipeline: auto (JIT if the CPU has SSE2 and the system saves SSE
# registers) | c | jit. Both give identical pictures.
#GLIDULATOR_RENDERER=auto

# Render workers on other cores: auto (cores - 1, at most 4) | 1 (render on
# the game's core only) | 2 | 3 | 4. Windows 95/98/ME always use one core.
#GLIDULATOR_THREADS=auto

# DOS: how the other cores are started. auto | ring0 (plain DOS / HIMEM
# only) | paging (DPMI host with page tables, e.g. HDPMI32i under SBEMU) |
# flat (DPMI host that maps memory 1:1, e.g. VDPMI) | off (one core).
#GLIDULATOR_SMP=auto

# DOS: wait for the vertical retrace. auto (as the game asks in
# grBufferSwap) | 0 (never) | 1 (always; for games that run too fast).
#GLIDULATOR_VSYNC=auto

# Board reported to the game: voodoo (Voodoo Graphics) | rush (Voodoo
# Rush; for Rush patches such as Tomb Raider's TUMBRUSH.EXE, which quit
# right after the intro otherwise). Only change it for such games.
#GLIDULATOR_BOARD=voodoo

# --- Image quality (all off by default) --------------------------------------
# Full-scene anti-aliasing like the Voodoo 5: 0 | 2 | 4 samples per pixel
# (2x / 4x render time) | auto (switches 0/2/4 to stay at 60 fps).
#GLIDULATOR_FSAA=0

# Cheap edge smoothing after rendering (about 1-2 ms per frame). 0 | 1
#GLIDULATOR_AA_POST=0

# Voodoo Graphics video output filter ("Voodoo look"): smooths the 16-bit
# dither pattern, keeps edges. 0 | 1 (3dfx's threshold 080408) | RRGGBB
# (own threshold, hex). Output then in 24/32 bit; about 4-5 ms per frame.
#GLIDULATOR_VOODOO_FILTER=0

# --- Start-up show -----------------------------------------------------------
# Logo once per program start: gl1 (Glidulator animation) | off |
# original (3dfx's spinning logo, read from GLIDULATOR_SPLASH_FILE).
#GLIDULATOR_SPLASH=gl1

# An original Voodoo Graphics GLIDE2X.OVL or glide2x.dll (shipped with many
# games). Only the logo's model and textures are read; nothing is executed.
#GLIDULATOR_SPLASH_FILE=C:\GAMES\POD\GLIDE2X.OVL

# Monitor effect: the picture locks on like an analog monitor when the
# game switches to 3D, and loses sync when it switches back. 0 | 1
#GLIDULATOR_CRT=0
